name: U702-A1 bounded Ubuntu 702 acquisition (diagnostic only)

on:
  push:
    branches:
      - codex/issue-13-u702-a1-acquisition

permissions:
  contents: read

concurrency:
  group: u702-a1-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    name: U702-A1 Ubuntu ${{ matrix.role }} 702
    if: ${{ github.event_name == 'push' && github.event.created == true && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        role: [producer, replay]
    env:
      U702_A1_ROLE: ${{ matrix.role }}
    steps:
      - name: Check out exact frozen H1 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ca47c37a0cfb9262480104a8fed04ab0a10212db
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.20.0"
      - name: Capture trusted paths and require fresh dependency roots
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ca47c37a0cfb9262480104a8fed04ab0a10212db
          test "$(git rev-parse HEAD^{tree})" = b503d8008b14be0d47bff28b50d36b00381fa58a
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e developer/node_modules
          test ! -e backend/node_modules
          command -v strace
          command -v gpg
          printf 'CI_TRUSTED_PYTHON=%s\n' "$(realpath "$pythonLocation/bin/python")" >> "$GITHUB_ENV"
          printf 'CI_TRUSTED_NODE=%s\n' "$(realpath "$(command -v node)")" >> "$GITHUB_ENV"
          printf 'CI_TRUSTED_NPM_ENTRY=%s\n' "$(realpath "$(command -v npm)")" >> "$GITHUB_ENV"
          printf 'CI_FRESH_DEPENDENCY_INSTALL=1\n' >> "$GITHUB_ENV"
      - name: Install fresh locked dependencies
        shell: bash
        run: |
          "$CI_TRUSTED_NODE" "$CI_TRUSTED_NPM_ENTRY" --prefix developer ci --ignore-scripts --no-audit --no-fund
          "$CI_TRUSTED_NODE" "$CI_TRUSTED_NPM_ENTRY" --prefix backend ci --ignore-scripts --no-audit --no-fund
      - name: Materialize acquisition observer outside the checkout
        shell: python
        run: |
          import base64, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'u702-a1-observer'
          root.mkdir(mode=0o700)
          (root / 'capture.py').write_bytes(base64.b64decode(''))
          (root / 'export.py').write_bytes(base64.b64decode(''))
          (root / 'reviewer-public.asc').write_bytes(base64.b64decode(''))
      - name: Acquire command 702 exactly once with raw process tracing
        id: acquisition
        shell: bash
        run: |
          set -euo pipefail
          observer="$RUNNER_TEMP/u702-a1-observer"
          output="$RUNNER_TEMP/u702-a1-raw"
          mkdir -m 700 "$output"
          strace --version > "$output/strace-version.txt"
          sha256sum "$(command -v strace)" > "$output/strace-sha256.txt"
          uname -a > "$output/kernel.txt"
          ulimit -f 131072
          set +e
          timeout --signal=TERM --kill-after=30s 1200s strace -ff -ttt -T -s 4096 \
            -e trace=%process,kill,tgkill,tkill,pidfd_open,pidfd_send_signal,setsid,prctl,poll,ppoll,select,pselect6 \
            -o "$output/process.strace" \
            "$CI_TRUSTED_PYTHON" -B "$observer/capture.py" "$U702_A1_ROLE" "$output" \
            > "$output/driver.stdout.raw" 2> "$output/driver.stderr.raw"
          result=$?
          printf '%s\n' "$result" > "$output/driver.exit-code.txt"
          exit "$result"
      - name: Encrypt exact raw acquisition evidence
        if: ${{ always() && steps.acquisition.outcome != 'skipped' && steps.acquisition.outcome != '' }}
        shell: bash
        run: |
          "$CI_TRUSTED_PYTHON" -B "$RUNNER_TEMP/u702-a1-observer/export.py" \
            "$RUNNER_TEMP/u702-a1-raw" "$RUNNER_TEMP/u702-a1-export" \
            "$RUNNER_TEMP/u702-a1-observer/reviewer-public.asc"
      - name: Upload encrypted acquisition evidence
        if: ${{ always() && steps.acquisition.outcome != 'skipped' && steps.acquisition.outcome != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: u702-a1-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/u702-a1-export/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
