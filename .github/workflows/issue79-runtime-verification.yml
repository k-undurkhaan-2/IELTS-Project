name: Issue 79 isolated runtime verification

on:
  pull_request:
    branches: [ci/master]
    paths:
      - .github/workflows/issue79-runtime-verification.yml
      - developer/tests/ci/public-listening-runtime/**

permissions:
  contents: read
  actions: read

concurrency:
  group: issue79-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  runtime-producer:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/issue-79-ci-runtime-verification-v1' &&
      github.event.pull_request.base.sha == 'd1f5bccc5acab9691e919b7a6be9201f39ccae1c'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      evidence-id: ${{ steps.producer-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Verify frozen runtime control sources
        shell: bash
        run: |
          printf '%s\n' '5c75be948dbf725b3128e9aae10bdbe2e2a5551949ee42a62250c759be76d02c  developer/tests/ci/public-listening-runtime/runtime.py' '64fd0950dbaf27843031c67661a706767a5d371c16830048dbfe5e5dcdcd02a1  developer/tests/ci/public-listening-runtime/authority.json' | sha256sum --check --strict
      - name: Produce isolated runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
          I79_CONTROL_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python -I developer/tests/ci/public-listening-runtime/runtime.py producer
      - name: Retain complete producer evidence
        id: producer-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue79-runtime-producer-${{ github.run_attempt }}
          path: ${{ runner.temp }}/i79-runtime-${{ github.run_id }}-${{ github.run_attempt }}-producer/evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Remove owned files after evidence retention
        if: ${{ always() && steps.producer-artifact.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          owned = root / ('i79-runtime-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-producer')
          assert owned.resolve().parent == root and not owned.is_symlink()
          shutil.rmtree(owned)
          assert not owned.exists()
          print('Owned producer files removed after successful evidence upload.')

  runtime-verifier:
    needs: runtime-producer
    if: >-
      always() && needs.runtime-producer.result == 'success' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/issue-79-ci-runtime-verification-v1' &&
      github.event.pull_request.base.sha == 'd1f5bccc5acab9691e919b7a6be9201f39ccae1c'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
      - name: Verify frozen runtime control sources
        shell: bash
        run: |
          printf '%s\n' '5c75be948dbf725b3128e9aae10bdbe2e2a5551949ee42a62250c759be76d02c  developer/tests/ci/public-listening-runtime/runtime.py' '64fd0950dbaf27843031c67661a706767a5d371c16830048dbfe5e5dcdcd02a1  developer/tests/ci/public-listening-runtime/authority.json' | sha256sum --check --strict
      - name: Acquire producer evidence by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.runtime-producer.outputs.evidence-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/i79-runtime-producer-input
      - name: Independently reconstruct and verify runtime evidence
        env:
          GH_TOKEN: ${{ github.token }}
          I79_CONTROL_COMMIT: ${{ github.event.pull_request.head.sha }}
          I79_PRODUCER_ARTIFACT_ID: ${{ needs.runtime-producer.outputs.evidence-id }}
        run: python -I developer/tests/ci/public-listening-runtime/runtime.py verifier --producer "$RUNNER_TEMP/i79-runtime-producer-input"
      - name: Retain complete verifier evidence
        id: verifier-artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue79-runtime-verifier-${{ github.run_attempt }}
          path: ${{ runner.temp }}/i79-runtime-${{ github.run_id }}-${{ github.run_attempt }}-verifier/evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Remove owned files after evidence retention
        if: ${{ always() && steps.verifier-artifact.outcome == 'success' }}
        shell: python
        run: |
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          for name in ['i79-runtime-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '-verifier', 'i79-runtime-producer-input']:
              owned = root / name
              assert owned.resolve().parent == root and not owned.is_symlink()
              if owned.exists():
                  shutil.rmtree(owned)
              assert not owned.exists()
          print('Owned verifier files removed after successful evidence upload.')
